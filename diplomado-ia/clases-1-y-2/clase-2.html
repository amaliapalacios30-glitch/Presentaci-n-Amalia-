const SLIDES=[{"tag": "APERTURA", "title": "¿CÓMO APRENDE UNA MÁQUINA?", "sub": "CLASE 2 DE 4 · FUNDAMENTOS DE LA INTELIGENCIA ARTIFICIAL", "html": "<div class=\"hero-stage\"><div class=\"orb\"><div class=\"orb-inner\">IA</div></div><div class=\"orb-trail t1\"></div><div class=\"orb-trail t2\"></div><span class=\"hero-side\">DATOS · PATRONES · DECISIONES</span></div><div class=\"pillrow\"><span>De la intuición humana</span><span>al aprendizaje de las máquinas</span></div><div class=\"spot\">Hoy no solo conocerás la IA. Aprenderás a reconocer lo que sucede detrás de sus respuestas.</div>", "chapter": "intro"}, {"tag": "CONEXIÓN HUMANA", "title": "¿Qué sabes reconocer sin saber explicar cómo?", "sub": "ANTES DE HABLAR DE ALGORITMOS, HABLEMOS DE NOSOTROS.", "html": "<div class=\"board\"><div class=\"board-top\"><span>PIzarra colaborativa · Canva</span><span class=\"live\"><i></i> En vivo</span></div><div class=\"board-question\">Escribe una cosa que reconoces casi de inmediato, pero te costaría explicar cómo la aprendiste.</div><div class=\"idea-cloud\"><span>Una voz familiar</span><span>La ironía</span><span>Una canción</span><span>Una señal de peligro</span><span>Una expresión facial</span></div><div class=\"field\"><input id=\"canvaURL\" type=\"url\" placeholder=\"Pega aquí el enlace de edición de tu pizarra de Canva\" aria-label=\"Enlace de pizarra Canva\"><button class=\"cta\" id=\"boardOpen\">Abrir pizarra ↗</button></div><p class=\"small\">El enlace debe permitir editar. Si aún no existe, <a href=\"https://www.canva.com/whiteboards/\" target=\"_blank\" rel=\"noopener\">crea una pizarra en Canva</a> y compártela con permiso de edición. La dirección se guarda solo en este navegador.</p></div><div class=\"insight\">No escriban el nombre de un programa de IA. Escriban una habilidad humana de reconocimiento.</div>", "chapter": "opening"}, {"tag": "CONEXIÓN", "title": "¿Qué tienen en común estas respuestas?", "sub": "DESCUBRIR UNA REGULARIDAD ES EL PRINCIPIO DE LA CONVERSACIÓN.", "html": "<div class=\"three reveal-grid\"><button data-reveal=\"r1\" class=\"tile\"><em>01</em><h3>Experiencias repetidas</h3><p>¿Cuántas veces escuchaste esa voz, esa canción o ese tono?</p><small class=\"reveal\" id=\"r1\">La experiencia aporta ejemplos.</small></button><button data-reveal=\"r2\" class=\"tile\"><em>02</em><h3>Características</h3><p>¿Qué señales te permiten distinguirlo de algo similar?</p><small class=\"reveal\" id=\"r2\">Reconocemos patrones y rasgos.</small></button><button data-reveal=\"r3\" class=\"tile\"><em>03</em><h3>Errores y ajustes</h3><p>¿Alguna vez confundiste una voz o interpretaste mal un gesto?</p><small class=\"reveal\" id=\"r3\">Corregimos nuestra interpretación con nueva evidencia.</small></button></div><div class=\"insight\">Una analogía, no una equivalencia: el aprendizaje humano es mucho más amplio que entrenar un modelo.</div>", "chapter": "opening"}, {"tag": "FUNDAMENTO 1", "title": "¿Qué es Machine Learning?", "sub": "APRENDER PATRONES A PARTIR DE DATOS.", "html": "<div class=\"definition\"><span>APRENDIZAJE AUTOMÁTICO</span><p>Rama de la inteligencia artificial en la que un modelo <strong>ajusta sus parámetros a partir de datos</strong> para hacer predicciones, clasificar o encontrar patrones en casos nuevos.</p></div><div class=\"compare\"><div><b>Regla programada</b><p>«Si la temperatura supera 30 °C, mostrar alerta».</p><code>if temperatura &gt; 30 → alertar</code></div><div><b>Modelo aprendido</b><p>«A partir de muchos ejemplos, estimar si un equipo podría fallar».</p><code>datos → entrenamiento → predicción</code></div></div>", "chapter": "teoria"}, {"tag": "FUNDAMENTO 2", "title": "La máquina no aprende “sola”", "sub": "LOS DATOS, LOS OBJETIVOS Y LOS CRITERIOS LOS DEFINEN PERSONAS.", "html": "<div class=\"pipeline\"><div><span>01</span><b>Problema</b><p>¿Qué queremos resolver?</p></div><div><span>02</span><b>Ejemplos</b><p>¿Qué datos tenemos?</p></div><div><span>03</span><b>Entrenamiento</b><p>¿Qué patrones se ajustan?</p></div><div><span>04</span><b>Prueba</b><p>¿Cómo funciona en casos nuevos?</p></div><div><span>05</span><b>Supervisión</b><p>¿Qué errores debemos corregir?</p></div></div><div class=\"insight\">La calidad del modelo no se demuestra repitiendo ejemplos que ya conocía: debe evaluarse con información no utilizada para entrenarlo.</div>", "chapter": "teoria"}, {"tag": "FUNDAMENTO 3", "title": "Los datos no son todos iguales", "sub": "UNA DECISIÓN TECNOLÓGICA DEPENDE DE QUÉ INFORMACIÓN TENEMOS.", "html": "<div class=\"three\"><div class=\"tile static\"><em>A</em><h3>Datos estructurados</h3><p>Fechas, categorías, cantidades, montos.</p><div class=\"mini-table\">Solicitud | Categoría<br>001 | Facturación<br>002 | Soporte</div></div><div class=\"tile static\"><em>B</em><h3>Datos no estructurados</h3><p>Correos, fotografías, grabaciones y documentos.</p><blockquote>«Mi computador no se conecta a internet».</blockquote></div><div class=\"tile static\"><em>C</em><h3>Etiquetas</h3><p>Respuestas de referencia usadas en algunas tareas.</p><span class=\"chip\">Factura → Facturación</span><span class=\"chip\">WiFi → Soporte</span></div></div>", "chapter": "teoria"}, {"tag": "FUNDAMENTO 4", "title": "Tres maneras de aprender", "sub": "NO TODOS LOS PROBLEMAS SE RESUELVEN CON EL MISMO ENFOQUE.", "html": "<div class=\"three\"><div class=\"tile static\"><em>01 · SUPERVISADO</em><h3>Aprender con ejemplos etiquetados</h3><p>Correos clasificados previamente como «spam» o «no spam».</p><div class=\"bottomtag\">Existe una respuesta de referencia.</div></div><div class=\"tile static\"><em>02 · NO SUPERVISADO</em><h3>Encontrar grupos o estructuras</h3><p>Agrupar hábitos de compra sin etiquetas previas para cada grupo.</p><div class=\"bottomtag\">Explora similitudes y diferencias.</div></div><div class=\"tile static\"><em>03 · POR REFUERZO</em><h3>Aprender a partir de recompensas</h3><p>Un agente ensaya estrategias en una simulación y recibe señales de desempeño.</p><div class=\"bottomtag\">Mejora una política de actuación.</div></div></div>", "chapter": "teoria"}, {"tag": "DISTINCIÓN", "title": "¿Qué método usarías?", "sub": "SELECCIONA UN CASO Y DESPUÉS COMPRUEBA TU RESPUESTA.", "html": "<div id=\"methodGame\" class=\"quiz-panel\"></div>", "chapter": "exercise"}, {"tag": "FUNDAMENTO 5", "title": "¿Qué es una red neuronal?", "sub": "OPERACIONES MATEMÁTICAS ORGANIZADAS EN CAPAS.", "html": "<div class=\"neural\"><svg viewBox=\"0 0 820 280\" aria-label=\"Diagrama de red neuronal: capa de entrada, capas intermedias y salida\" role=\"img\"><g id=\"connections\" stroke=\"#4bd9e1\" stroke-opacity=\".4\" stroke-width=\"1.8\"></g><g id=\"nodes\"></g></svg><div class=\"neural-labels\"><span>ENTRADAS<br><small>Datos</small></span><span>CAPAS INTERMEDIAS<br><small>Transformaciones con pesos</small></span><span>SALIDA<br><small>Predicción</small></span></div></div><div class=\"insight\">No es un cerebro humano. La palabra «neuronal» es una inspiración histórica para una arquitectura matemática.</div>", "chapter": "teoria"}, {"tag": "FUNDAMENTO 6", "title": "Deep Learning ≠ toda la IA", "sub": "UNA FAMILIA DE TÉCNICAS, NO OTRA PALABRA PARA “CHATBOT”.", "html": "<div class=\"nested\"><div class=\"n-outer\"><strong>INTELIGENCIA ARTIFICIAL</strong><div class=\"n-mid\"><strong>MACHINE LEARNING</strong><div class=\"n-inner\"><strong>DEEP LEARNING</strong><p>Redes neuronales de múltiples capas</p></div></div></div></div><div class=\"insight\">Los modelos generativos modernos suelen utilizar aprendizaje profundo, pero no toda la IA es generativa y no todo Machine Learning requiere redes neuronales profundas.</div>", "chapter": "teoria"}, {"tag": "FUNDAMENTO 7", "title": "Cuando una IA interpreta imágenes", "sub": "VISIÓN POR COMPUTADOR: TRES TAREAS DISTINTAS.", "html": "<div class=\"three\"><div class=\"tile static\"><div class=\"bigemoji\">🐈</div><h3>Clasificación</h3><p>¿Qué aparece en la imagen?</p><span class=\"chip\">Resultado: «gato»</span></div><div class=\"tile static\"><div class=\"bigemoji\">🚗</div><h3>Detección</h3><p>¿Dónde están los vehículos?</p><span class=\"chip\">Resultado: posiciones</span></div><div class=\"tile static\"><div class=\"bigemoji\">🧩</div><h3>Segmentación</h3><p>¿Qué píxeles pertenecen a cada objeto?</p><span class=\"chip\">Resultado: regiones</span></div></div><div class=\"insight\">Los errores pueden cambiar con la iluminación, el fondo o las imágenes utilizadas durante el entrenamiento.</div>", "chapter": "teoria"}, {"tag": "FUNDAMENTO 8", "title": "Cuando una IA trabaja con lenguaje", "sub": "NLP: PROCESAMIENTO DEL LENGUAJE NATURAL.", "html": "<div class=\"three\"><div class=\"tile static\"><em>CLASIFICAR</em><h3>Identificar intención</h3><p>«Mi factura llegó duplicada».</p><strong>→ Reclamación de facturación</strong></div><div class=\"tile static\"><em>EXTRAER</em><h3>Reconocer información</h3><p>«La reunión es el 12 de noviembre».</p><strong>→ Fecha: 12 de noviembre</strong></div><div class=\"tile static\"><em>GENERAR</em><h3>Producir texto</h3><p>Crear un borrador a partir de instrucciones.</p><strong>→ Requiere revisión humana</strong></div></div>", "chapter": "teoria"}, {"tag": "APLICACIÓN", "title": "¿Qué significa “entender” un mensaje?", "sub": "EL CONTEXTO CAMBIA LA INTERPRETACIÓN.", "html": "<div class=\"context-game\"><div class=\"sentence\" id=\"contextSentence\">«El banco estaba junto al río».</div><div class=\"choice-row\"><button class=\"choice\" data-context=\"rio\">Banco para sentarse</button><button class=\"choice\" data-context=\"dinero\">Entidad financiera</button></div><div id=\"contextFeedback\" class=\"feedback\" aria-live=\"polite\">Elige una interpretación.</div></div><div class=\"insight\">Una misma palabra puede tener significados distintos. El procesamiento del lenguaje utiliza señales del contexto, pero también puede cometer errores.</div>", "chapter": "exercise"}, {"tag": "FUNDAMENTO 9", "title": "¿Qué es un LLM?", "sub": "MODELO DE LENGUAJE DE GRAN TAMAÑO.", "html": "<div class=\"definition\"><span>LLM · LARGE LANGUAGE MODEL</span><p>Un modelo entrenado con grandes cantidades de datos que produce secuencias de <strong>tokens</strong> según patrones estadísticos y el contexto disponible.</p></div><div class=\"three\"><div class=\"tile static\"><h3>Token</h3><p>Unidad de texto procesada por el modelo; no equivale siempre a una palabra.</p></div><div class=\"tile static\"><h3>Contexto</h3><p>Información disponible para producir la siguiente respuesta.</p></div><div class=\"tile static\"><h3>Probabilidad</h3><p>Elige continuaciones plausibles; plausible no significa verdadero.</p></div></div>", "chapter": "teoria"}, {"tag": "EXPERIENCIA", "title": "¿Qué palabra sigue?", "sub": "UNA MINI SIMULACIÓN DIDÁCTICA SOBRE PREDICCIÓN DE TEXTO.", "html": "<div class=\"predict\"><p>Completa la frase:</p><h3>«La reunión comienza a las…»</h3><div class=\"choice-row\"><button data-pred=\"ocho\" class=\"choice\">ocho</button><button data-pred=\"azules\" class=\"choice\">azules</button><button data-pred=\"jueves\" class=\"choice\">jueves</button></div><div id=\"predictFeedback\" class=\"feedback\" aria-live=\"polite\">Selecciona la continuación que te parezca más probable.</div></div><div class=\"insight\">Esto ilustra la noción de continuidad probable, pero NO es el tokenizador ni el funcionamiento completo de un LLM real.</div>", "chapter": "exercise"}, {"tag": "FUNDAMENTO 10", "title": "IA multimodal", "sub": "UN MODELO PUEDE COMBINAR DISTINTOS TIPOS DE INFORMACIÓN.", "html": "<div class=\"four\"><div class=\"tile static\"><div class=\"bigemoji\">📝</div><h3>Texto</h3><p>Documentos, preguntas</p></div><div class=\"tile static\"><div class=\"bigemoji\">🖼️</div><h3>Imagen</h3><p>Fotografías, diagramas</p></div><div class=\"tile static\"><div class=\"bigemoji\">🎙️</div><h3>Audio</h3><p>Voz, transcripciones</p></div><div class=\"tile static\"><div class=\"bigemoji\">🎬</div><h3>Video</h3><p>Secuencias de imágenes</p></div></div><div class=\"insight\">No todas las versiones de un asistente pueden procesar o generar todas las modalidades.</div>", "chapter": "teoria"}, {"tag": "PAUSA", "title": "15 MINUTOS DE DESCANSO", "sub": "CUANDO REGRESEMOS: DE LA TEORÍA A COPILOT.", "html": "<div class=\"breakscreen\"><div id=\"breakClock\">15:00</div><button id=\"startBreak\" class=\"cta\">Iniciar cuenta regresiva</button><button id=\"resetBreak\" class=\"quiet\">Reiniciar</button><p>Al volver, veremos cómo aplicar los conceptos sin confundir usar Copilot con entrenar un modelo.</p></div>", "chapter": "break"}, {"tag": "COPILOT BÁSICO", "title": "Lo que sí vamos a utilizar", "sub": "TU M365 COPILOT (BÁSICO), SIN FUNCIONES PREMIUM.", "html": "<div class=\"three\"><div class=\"tile static\"><h3>Chat</h3><p>Preguntas, análisis de texto y conversación sobre un caso ficticio.</p></div><div class=\"tile static\"><h3>Archivos adjuntos</h3><p>Si tu cuenta lo permite, puedes cargar un documento para preguntar sobre su contenido.</p></div><div class=\"tile static\"><h3>Respuestas verificables</h3><p>Solicitar tablas, criterios, límites y revisión de conclusiones.</p></div></div><div class=\"insight\">Vamos a utilizar solo Copilot Chat. No asumimos que puedas acceder a todos los correos, reuniones, SharePoint o funciones Premium.</div>", "chapter": "teoria"}, {"tag": "DEMOSTRACIÓN 1", "title": "De una lista a una clasificación", "sub": "PRIMERO EL CONCEPTO; AHORA UNA APLICACIÓN EN COPILOT.", "html": "<div class=\"demo\"><div class=\"demo-context\"><b>CASO FICTICIO</b><p>Cuatro solicitudes llegaron a un centro de servicio:</p><ol><li>No recibí la factura de octubre.</li><li>Mi computador no se conecta a internet.</li><li>Quiero conocer el estado de mi pedido.</li><li>Mi factura presenta un cobro duplicado.</li></ol><div class=\"mini-ask\">¿Qué patrón permite agruparlas?</div></div><div class=\"demo-prompt\"><b>PROMPT COMPLETO</b><pre id=\"prompt1\">Actúa como analista de servicio al cliente. Trabaja únicamente con este caso ficticio: (1) No recibí la factura de octubre; (2) Mi computador no se conecta a internet; (3) Quiero conocer el estado de mi pedido; (4) Mi factura presenta un cobro duplicado. Clasifica cada solicitud por categoría, explica qué palabras del texto apoyan la clasificación y señala qué casos podrían ser ambiguos. Presenta una tabla con solicitud, categoría y justificación. No inventes información de clientes, sistemas ni resultados reales.</pre><div class=\"prompt-actions\"><button class=\"cta\" data-copy=\"prompt1\">Copiar prompt</button><a class=\"outlink\" href=\"https://copilot.cloud.microsoft/\" target=\"_blank\" rel=\"noopener\">Abrir Copilot ↗</a></div></div></div>", "chapter": "copilot"}, {"tag": "COMPROBACIÓN 1", "title": "¿Clasificar con Copilot es entrenar ML?", "sub": "ESTA DISTINCIÓN ES CENTRAL.", "html": "<div class=\"choice-grid\"><button data-check=\"already\" class=\"answer-card\"><span>A</span> Copilot acaba de entrenar un modelo nuevo con cuatro solicitudes.</button><button data-check=\"pretrained\" class=\"answer-card\"><span>B</span> Copilot utiliza capacidades de un modelo previamente entrenado para interpretar el texto.</button></div><div id=\"checkFeedback\" class=\"feedback\">Selecciona una respuesta para revelar la explicación.</div><div class=\"insight\">Para entrenar un clasificador propio se necesitarían otros pasos: preparar datos, seleccionar enfoque, entrenar y evaluar. Aquí no hacemos eso.</div>", "chapter": "exercise"}, {"tag": "DEMOSTRACIÓN 2", "title": "Cuando la cantidad de datos engaña", "sub": "COPILOT NOS AYUDA A RAZONAR SOBRE LA CALIDAD DE LOS DATOS.", "html": "<div class=\"demo\"><div class=\"demo-context\"><b>CASO FICTICIO</b><div class=\"data-bars\"><div><span>Facturación</span><b style=\"width:100%\">100</b></div><div><span>Soporte</span><b style=\"width:20%\">20</b></div><div><span>Entregas</span><b style=\"width:5%\">5</b></div></div><p>¿Qué podría pasar si solo recogemos información de una categoría?</p></div><div class=\"demo-prompt\"><b>PROMPT COMPLETO</b><pre id=\"prompt2\">Actúa como especialista en aprendizaje automático. Una empresa ficticia tiene 100 registros de facturación, 20 de soporte técnico y 5 de entregas. Quiere usar estos datos para desarrollar un clasificador. Explica, sin suponer que el sistema ya está entrenado: (1) qué problemas podría causar esta distribución; (2) qué datos adicionales convendría revisar; (3) cómo separar entrenamiento y evaluación; (4) qué errores deberíamos vigilar. Organiza la respuesta en una tabla clara y termina con tres preguntas críticas sobre la calidad de los datos. No inventes porcentajes de precisión.</pre><div class=\"prompt-actions\"><button class=\"cta\" data-copy=\"prompt2\">Copiar prompt</button><a class=\"outlink\" href=\"https://copilot.cloud.microsoft/\" target=\"_blank\" rel=\"noopener\">Abrir Copilot ↗</a></div></div></div>", "chapter": "copilot"}, {"tag": "DEMOSTRACIÓN 3", "title": "Una respuesta convincente puede ser falsa", "sub": "LA VALIDACIÓN ES PARTE DEL TRABAJO CON LLM.", "html": "<div class=\"demo\"><div class=\"demo-context\"><b>CASO FICTICIO</b><p>120 solicitudes recibidas: 72 resueltas a tiempo, 30 fuera de plazo y 18 abiertas al cierre.</p><div class=\"statrow\"><span><b>72</b> A tiempo</span><span><b>30</b> Fuera de plazo</span><span><b>18</b> Abiertas</span></div><p>Las tres categorías son excluyentes. No hay datos de satisfacción, causas ni periodos anteriores.</p></div><div class=\"demo-prompt\"><b>PROMPT COMPLETO</b><pre id=\"prompt3\">Actúa como analista de gestión. Utiliza únicamente estos datos ficticios de octubre: 120 solicitudes recibidas, 72 resueltas dentro del plazo, 30 fuera de plazo y 18 abiertas al cierre. Las categorías son excluyentes. Calcula el porcentaje que representa cada categoría sobre 120, comprueba que los porcentajes sumen 100 % y presenta una tabla. Después distingue entre tres hallazgos que sí se pueden afirmar y tres afirmaciones que NO están respaldadas por los datos. No inventes causas, satisfacción, resultados de otros meses ni mejoras obtenidas.</pre><div class=\"prompt-actions\"><button class=\"cta\" data-copy=\"prompt3\">Copiar prompt</button><a class=\"outlink\" href=\"https://copilot.cloud.microsoft/\" target=\"_blank\" rel=\"noopener\">Abrir Copilot ↗</a></div></div></div>", "chapter": "copilot"}, {"tag": "VALIDACIÓN", "title": "¿Qué conclusiones están respaldadas?", "sub": "PULSA PARA MARCAR LAS QUE SÍ SE PUEDEN AFIRMAR.", "html": "<div class=\"factgame\" id=\"factGame\"></div><div class=\"insight\">En el caso ficticio: 60 % a tiempo, 25 % fuera de plazo y 15 % abiertas. No conocemos causas ni satisfacción.</div>", "chapter": "exercise"}, {"tag": "APLICACIÓN", "title": "Ahora conecta toda la clase", "sub": "IDENTIFICA TECNOLOGÍA, DATO, VALOR Y LÍMITE.", "html": "<div class=\"application\"><div class=\"case-title\">Una organización quiere clasificar mensajes entrantes y detectar los que necesitan atención.</div><div id=\"applyQuestions\" class=\"apply-grid\"></div><div id=\"applySummary\" class=\"feedback\">Selecciona cada dimensión para ver qué debería analizarse antes de usar IA.</div></div>", "chapter": "exercise"}, {"tag": "COMPRUEBA", "title": "Cinco preguntas, cinco decisiones", "sub": "PON A PRUEBA LO QUE APRENDISTE, SIN MEMORIZAR DEFINICIONES.", "html": "<div id=\"quizPanel\" class=\"quiz-panel\"></div>", "chapter": "exercise"}, {"tag": "CIERRE", "title": "¿Qué cambió en tu manera de ver la IA?", "sub": "NO BASTA CON QUE RESPONDA. IMPORTA CÓMO LLEGAMOS A CONFIAR EN EL RESULTADO.", "html": "<div class=\"closing\"><div><span>HOY COMPRENDIMOS</span><strong>DATOS → MODELOS → RESPUESTAS → VERIFICACIÓN</strong></div><div class=\"closing-questions\">¿Qué depende de los datos?<br>¿Qué puede fallar?<br>¿Qué debe verificar una persona?</div></div><div class=\"pillrow\"><span>Machine Learning</span><span>Deep Learning</span><span>NLP</span><span>LLM</span><span>IA multimodal</span><span>Copilot Básico</span></div><div class=\"spot\">En la Clase 3: herramientas de IA generativa y transformación digital. ¿Cómo elegimos una tecnología adecuada?</div>", "chapter": "end"}];
let index=0,breakSeconds=900,breakTimer=null,quizIndex=0,quizScore=0,quizAnswered=false,methodIndex=0,methodAnswered=false;const $=(id)=>document.getElementById(id);const methodCases=[{q:'Clasificar correos a partir de ejemplos previamente marcados como spam o no spam.',answers:['Supervisado','No supervisado','Por refuerzo'],correct:0,why:'La etiqueta de cada ejemplo proporciona una respuesta conocida.'},{q:'Agrupar clientes por similitudes sin categorías definidas previamente.',answers:['Supervisado','No supervisado','Por refuerzo'],correct:1,why:'Se busca estructura sin una etiqueta objetivo por grupo.'},{q:'Un agente aprende a elegir acciones en una simulación recibiendo recompensas.',answers:['Supervisado','No supervisado','Por refuerzo'],correct:2,why:'Las señales de recompensa permiten mejorar una política de decisiones.'}];const quiz=[{q:'¿Qué caracteriza a Machine Learning?',opts:['Aprender patrones de ejemplos','Seguir únicamente un cronómetro','Enviar correos automáticamente'],correct:0,why:'El entrenamiento ajusta parámetros utilizando datos.'},{q:'¿Qué es Deep Learning?',opts:['Todas las aplicaciones de IA','Una familia de Machine Learning basada en redes profundas','Un tipo de archivo'],correct:1,why:'Es un subconjunto dentro de aprendizaje automático.'},{q:'¿Qué significa NLP?',opts:['Procesamiento del lenguaje natural','Procesamiento gráfico en GPU','Una herramienta de videollamadas'],correct:0,why:'Incluye técnicas para trabajar con lenguaje humano.'},{q:'¿Qué produce un LLM?',opts:['Respuestas siempre verdaderas','Secuencias de tokens basadas en contexto y patrones','Solo operaciones aritméticas'],correct:1,why:'Puede producir contenido plausible y también errores.'},{q:'¿Qué hicimos al clasificar solicitudes con Copilot?',opts:['Entrenar un clasificador propio','Usar un modelo existente para interpretar texto','Entrenar una GPU nueva'],correct:1,why:'La interacción no reentrenó el modelo.'}];
function render(){if(index<0)index=0;if(index>=SLIDES.length)index=SLIDES.length-1;const s=SLIDES[index];$('scene').innerHTML=`<div class="eyebrow">${s.tag} · ${String(index+1).padStart(2,'0')} / ${SLIDES.length}</div><h${index===0?1:2}>${s.title}</h${index===0?1:2}><div class="subtitle">${s.sub}</div>${s.html}`; $('scene').style.animation='none';void $('scene').offsetWidth;$('scene').style.animation='enter .48s ease both';$('progressFill').style.width=`${(index+1)/SLIDES.length*100}%`; $('count').textContent=String(index+1).padStart(2,'0')+' / '+SLIDES.length;$('prevBtn').disabled=index===0;$('nextBtn').disabled=index===SLIDES.length-1;renderNav();bind();window.scrollTo({top:0,behavior:'instant'})}
function renderNav(){$('slideNav').innerHTML=SLIDES.map((s,i)=>`<button class="navitem ${i===index?'active':''}" data-jump="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</button>`).join('');document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{go(Number(el.dataset.jump));$('sidebar').classList.remove('open')})}
function go(i){if(breakTimer&&index!==i){clearInterval(breakTimer);breakTimer=null}index=i;render()}function move(d){go(index+d)}function bind(){document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>b.classList.toggle('show'));const inp=$('canvaURL');if(inp){inp.value=localStorage.getItem('canvaWhiteboardURL')||'';inp.onchange=()=>localStorage.setItem('canvaWhiteboardURL',inp.value.trim());$('boardOpen').onclick=()=>{const url=inp.value.trim();if(!/^https:\/\/(www\.)?canva\.com\//i.test(url)){alert('Pega primero el enlace real de tu pizarra de Canva. Si todavía no existe, usa el enlace «crea una pizarra en Canva» que aparece debajo.');return}localStorage.setItem('canvaWhiteboardURL',url);window.open(url,'_blank','noopener,noreferrer')}}
if($('connections'))drawNeural();if($('methodGame'))drawMethod();if($('quizPanel'))drawQuiz();if($('breakClock'))bindBreak();if($('factGame'))drawFact();if($('applyQuestions'))drawApply();document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const t=$(b.dataset.copy).textContent;try{await navigator.clipboard.writeText(t);b.textContent='Copiado ✓'}catch(e){const range=document.createRange();range.selectNodeContents($(b.dataset.copy));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Texto seleccionado: presiona Ctrl+C'}});document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{$('contextFeedback').textContent=b.dataset.context==='rio'?'Correcto: aquí «banco» se interpreta naturalmente como un asiento junto al río.':'En esa oración, «junto al río» orienta a pensar en un asiento; el contexto cambia el sentido.'});document.querySelectorAll('[data-pred]').forEach(b=>b.onclick=()=>{$('predictFeedback').textContent=b.dataset.pred==='ocho'?'«Ocho» es una continuación plausible, pero no la única.':'En este contexto, «ocho» sería una continuación más natural. En otros contextos la probabilidad cambia.'});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{$('checkFeedback').textContent=b.dataset.check==='pretrained'?'Correcto. Copilot interpreta texto mediante un modelo ya entrenado; no lo reentrenaste con esas cuatro solicitudes.':'No. En esta demostración no se entrenó un modelo nuevo; se usó un modelo existente.'})}
function drawMethod(){const c=methodCases[methodIndex];$('methodGame').innerHTML=`<div class="eyebrow">CASO ${methodIndex+1} DE ${methodCases.length}</div><p class="quiz-question">${c.q}</p><div class="quiz-options">${c.answers.map((a,i)=>`<button class="quiz-option" data-method="${i}">${a}</button>`).join('')}</div><div class="quiz-results" id="methodFeedback"></div><button id="nextMethod" class="cta" style="margin-top:20px">${methodIndex===methodCases.length-1?'Reiniciar casos':'Siguiente caso →'}</button>`;document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{$('methodFeedback').innerHTML=Number(b.dataset.method)===c.correct?`<span class="right">Correcto.</span> ${c.why}`:`<span class="wrong">Revisemos:</span> ${c.why}`});$('nextMethod').onclick=()=>{methodIndex=(methodIndex+1)%methodCases.length;drawMethod()}}
function drawQuiz(){const el=$('quizPanel');if(quizIndex>=quiz.length){el.innerHTML=`<div class="eyebrow">RESULTADO DEL RETO</div><h3>${quizScore} respuestas correctas de ${quiz.length}</h3><p>La clave es saber explicar el criterio, no solo elegir la opción.</p><button class="cta" id="restartQuiz">Reiniciar reto</button>`;$('restartQuiz').onclick=()=>{quizIndex=0;quizScore=0;quizAnswered=false;drawQuiz()};return}const q=quiz[quizIndex];el.innerHTML=`<span class="eyebrow">PREGUNTA ${quizIndex+1} / ${quiz.length}</span><p class="quiz-question">${q.q}</p><div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-option" data-quiz="${i}">${o}</button>`).join('')}</div><div id="quizFeedback" class="quiz-results"></div><button id="quizContinue" class="cta" style="margin-top:18px" disabled>Siguiente →</button>`;document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;const correct=Number(b.dataset.quiz)===q.correct;if(correct)quizScore++;$('quizFeedback').innerHTML=`<span class="${correct?'right':'wrong'}">${correct?'Correcto':'Revisemos'}.</span> ${q.why}`;$('quizContinue').disabled=false});$('quizContinue').onclick=()=>{quizIndex++;quizAnswered=false;drawQuiz()}}
function drawNeural(){const svg=$('connections'),ns='http://www.w3.org/2000/svg',nodes=$('nodes');const cols=[[60,65,135,205],[330,40,100,160,220],[570,70,135,200],[760,135]];let prev=null;cols.forEach((ys,c)=>{if(prev)ys.forEach(y=>prev.forEach(py=>{const line=document.createElementNS(ns,'line');line.setAttribute('x1',([60,330,570][c-1]));line.setAttribute('y1',py);line.setAttribute('x2',([60,330,570,760][c]));line.setAttribute('y2',y);svg.append(line)}));ys.forEach(y=>{const circle=document.createElementNS(ns,'circle');circle.setAttribute('cx',([60,330,570,760][c]));circle.setAttribute('cy',y);circle.setAttribute('r','12');circle.setAttribute('fill',c===3?'#ff9b58':c===0?'#70e8e9':'#9e82ff');circle.setAttribute('stroke','#d8efff');circle.setAttribute('stroke-width','1.3');nodes.append(circle)});prev=ys})}
function bindBreak(){function refresh(){let m=Math.floor(breakSeconds/60),s=breakSeconds%60;$('breakClock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}refresh();$('startBreak').onclick=()=>{if(breakTimer)return;breakTimer=setInterval(()=>{breakSeconds=Math.max(0,breakSeconds-1);refresh();if(breakSeconds===0){clearInterval(breakTimer);breakTimer=null}},1000)};$('resetBreak').onclick=()=>{if(breakTimer)clearInterval(breakTimer);breakTimer=null;breakSeconds=900;refresh()}}
const facts=[['60 % de solicitudes se resolvieron a tiempo',true,'Sí: 72 / 120 = 60 %.'],['El servicio mejoró frente al mes anterior',false,'No hay información de periodos anteriores.'],['25 % de solicitudes se resolvieron fuera del plazo',true,'Sí: 30 / 120 = 25 %.'],['La mayoría de clientes está insatisfecha',false,'No se midió satisfacción.'],['15 % de solicitudes seguían abiertas',true,'Sí: 18 / 120 = 15 %.'],['La causa principal de los atrasos fue falta de personal',false,'No conocemos las causas.']];function drawFact(){$('factGame').innerHTML=facts.map((x,i)=>`<button class="fact" data-fact="${i}">${x[0]}<small>${x[1]?'SÍ SUSTENTADA':'NO SUSTENTADA'} · ${x[2]}</small></button>`).join('');document.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>b.classList.toggle('selected'))}
const applies=[['Tecnología','Clasificación de texto con NLP/ML; una regla simple puede servir para casos muy previsibles.'],['Datos','Solicitudes representativas, categorías claras y ejemplos de diferentes situaciones.'],['Beneficio','Ayudar a ordenar la atención; el impacto debe medirse, no suponerse.'],['Control humano','Revisar categorías ambiguas, errores, privacidad y decisiones sensibles.']];function drawApply(){$('applyQuestions').innerHTML=applies.map((x,i)=>`<button data-apply="${i}">${x[0]}</button>`).join('');document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{$('applySummary').textContent=applies[Number(b.dataset.apply)][1]})}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('indexBtn').onclick=()=>$('sidebar').classList.toggle('open');$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});render();
</script></body></html>
