<script>
const slides=[{"section": "Apertura", "kicker": "ÚLTIMA CLASE DEL MÓDULO", "title": "Del asombro a la aplicación", "lead": "Tres horas para organizar información, comprenderla y comunicarla con criterio.", "body": "<div class=\"pillline\"><span>Cuadernos de Copilot</span><span>NotebookLM</span><span>Dashboards</span></div><p class=\"smallprint\">Módulo de inteligencia artificial · Amalia Avila Palacios</p>", "visual": "hero", "tag": null}, {"section": "Apertura", "kicker": "ROMPEHIELOS · 15 MIN", "title": "El museo de lo imposible", "lead": "La imaginación inaugura nuestra última sesión del módulo.", "body": "<p>Entraremos al museo 3D, escucharemos las ideas del grupo y recorreremos la exposición.</p><a class=\"actionlink\" target=\"_blank\" rel=\"noopener\" href=\"https://presentacion-amalia8.vercel.app/diplomado-ia/museo-de-lo-imposible/\">Abrir museo virtual ↗</a><p class=\"smallprint\">Esta es la actividad ya preparada. No crearemos un segundo rompehielos.</p>", "visual": "museum", "tag": null}, {"section": "Ruta", "kicker": "HOJA DE RUTA", "title": "Tres herramientas. Un propósito.", "lead": "Primero comprender; después ver un ejemplo; finalmente aplicar.", "body": "<div class=\"timeline\"><div><b>15 min</b><span>Museo</span></div><div><b>30 min</b><span>Copilot Notebooks</span></div><div><b>40 min</b><span>NotebookLM</span></div><div><b>15 min</b><span>Descanso</span></div><div><b>20 min</b><span>Teoría dashboards</span></div><div><b>35 min</b><span>Tu ejercicio</span></div><div><b>25 min</b><span>Cierre del módulo</span></div></div>", "visual": "route", "tag": null}, {"section": "Copilot", "kicker": "TEORÍA · QUÉ ES", "title": "Cuadernos de Copilot", "lead": "Un espacio para reunir referencias y conversar con ellas mediante IA.", "body": "<div class=\"explain\"><p>Un <strong>cuaderno de Microsoft Copilot</strong> reúne contenido relacionado con un asunto y permite hacer preguntas o crear contenido contextualizado a partir de esas referencias.</p><p><strong>No es lo mismo que OneNote:</strong> OneNote organiza notas y páginas; Copilot Notebooks se centra en trabajar con un conjunto de referencias mediante IA.</p></div><div class=\"source\">Fuente: Microsoft Support · Cuadernos de Copilot</div>", "visual": "notebook", "tag": null}, {"section": "Copilot", "kicker": "TEORÍA · CÓMO FUNCIONA", "title": "Tres elementos de un cuaderno", "lead": "El resultado depende de las referencias que eliges y de lo que preguntas.", "body": "<div class=\"stepcards\"><article><b>01</b><h3>Referencias</h3><p>Documentos y contenido autorizado que aportas al cuaderno.</p></article><article><b>02</b><h3>Pregunta</h3><p>Una solicitud concreta vinculada con esas fuentes.</p></article><article><b>03</b><h3>Verificación</h3><p>Contrastar las respuestas con los archivos originales.</p></article></div><div class=\"source\">Fuente: Microsoft Support · Funcionamiento y referencias</div>", "visual": "flow", "tag": null}, {"section": "Copilot", "kicker": "EJEMPLO · DESPUÉS DE LA TEORÍA", "title": "El cuaderno de una reunión", "lead": "Ejemplo ilustrativo: usar solamente documentos autorizados.", "body": "<div class=\"scenario\"><div class=\"scenarioHead\">FUENTES DISPONIBLES</div><div class=\"docs\"><span>Acta de reunión</span><span>Lista de acuerdos</span><span>Documento de seguimiento</span></div><div class=\"scenarioHead\">PREGUNTA A COPILOT</div><blockquote>“Según estas referencias, ¿qué acuerdos quedaron registrados y cuáles no tienen responsable indicado? Señala dónde aparece cada respuesta. No completes datos faltantes”.</blockquote><div class=\"truth\">El ejemplo es una simulación didáctica, no una respuesta generada por Copilot.</div></div>", "visual": "example", "tag": null}, {"section": "Copilot", "kicker": "DEMOSTRACIÓN · PASO A PASO", "title": "Cómo mostrarlo en pantalla", "lead": "Sigue la interfaz que realmente tenga habilitada tu cuenta.", "body": "<div class=\"numberlist\"><p><i>1</i> Abrir Microsoft Copilot e identificar la sección de <strong>Cuadernos / Notebooks</strong>, si está disponible.</p><p><i>2</i> Crear un cuaderno y agregar referencias que se puedan usar.</p><p><i>3</i> Escribir una pregunta específica y comprobar la respuesta en las fuentes.</p><p><i>4</i> Mostrar qué información falta y cómo afinar la pregunta.</p></div><a class=\"actionlink\" target=\"_blank\" rel=\"noopener\" href=\"https://m365.cloud.microsoft/\">Abrir Microsoft 365 ↗</a>", "visual": "steps", "tag": null}, {"section": "Copilot", "kicker": "PRECAUCIÓN · LICENCIAS", "title": "¿Y si el estudiante no ve Cuadernos?", "lead": "La disponibilidad no es igual en todas las cuentas.", "body": "<div class=\"contrast\"><div><h3>Confirmado por Microsoft</h3><p>Copilot Notebooks está disponible para usuarios elegibles de Copilot y Copilot Chat; crear cuadernos requiere un plan de servicio de SharePoint u OneDrive. Las funciones y límites varían por licencia.</p></div><div><h3>Qué hacemos en clase</h3><p>La demostración puede proyectarse desde una cuenta habilitada. No pedimos a nadie que cargue información institucional o sensible en cuentas no autorizadas.</p></div></div><div class=\"source\">Fuentes: Microsoft Support · FAQ y Licensing (noviembre de 2026)</div>", "visual": "warning", "tag": null}, {"section": "NotebookLM", "kicker": "TEORÍA · QUÉ ES", "title": "NotebookLM: investigar con fuentes", "lead": "Un asistente para explorar y comprender documentos que tú seleccionas.", "body": "<div class=\"explain\"><p>NotebookLM permite reunir fuentes compatibles y hacer preguntas orientadas al contenido de esas fuentes. Sus respuestas pueden ofrecer referencias para comprobar la información.</p><p>Además de conversar con los documentos, su espacio <strong>Studio</strong> permite crear materiales de estudio y exploración, según las funciones y el acceso disponibles.</p></div><div class=\"source\">Fuente: Ayuda oficial de Google · NotebookLM</div>", "visual": "books", "tag": null}, {"section": "NotebookLM", "kicker": "TEORÍA · FUENTES", "title": "¿Qué puedo incorporar?", "lead": "Empieza por documentos que tengas derecho a utilizar.", "body": "<div class=\"tilegrid\"><div>📄<b>PDF y documentos</b><small>Textos e informes</small></div><div>🔗<b>Enlaces web</b><small>Páginas compatibles</small></div><div>🎧<b>Audio</b><small>Archivos compatibles</small></div><div>▶<b>Vídeos de YouTube</b><small>Fuentes compatibles</small></div></div><p class=\"smallprint\">Los formatos, límites y disponibilidad pueden cambiar. Verifica las opciones de la cuenta antes de la demostración.</p><div class=\"source\">Fuente: Ayuda oficial de Google · Añadir fuentes</div>", "visual": "tiles", "tag": null}, {"section": "NotebookLM", "kicker": "TEORÍA · FUNCIONES", "title": "De leer a comprender", "lead": "Un mismo conjunto de fuentes puede explorarse en formatos diferentes.", "body": "<div class=\"stepcards\"><article><b>01</b><h3>Preguntas</h3><p>Buscar afirmaciones, comparar apartados y pedir aclaraciones con soporte.</p></article><article><b>02</b><h3>Mapa mental</h3><p>Ver los temas principales y sus relaciones.</p></article><article><b>03</b><h3>Resumen de audio</h3><p>Escuchar una síntesis generada a partir del material.</p></article></div><div class=\"source\">Fuentes: Google Help · Mapas mentales y resúmenes de audio</div>", "visual": "mindmap", "tag": null}, {"section": "NotebookLM", "kicker": "EJEMPLO · DESPUÉS DE LA TEORÍA", "title": "Una política, tres formas de entenderla", "lead": "Ejemplo didáctico, sin inventar una política institucional.", "body": "<div class=\"scenario\"><div class=\"scenarioHead\">FUENTE</div><p>Un documento público o un PDF de ejemplo que se haya leído previamente.</p><div class=\"scenarioHead\">PREGUNTAS</div><blockquote>“Resume las ideas principales y cita las partes que las respaldan”.</blockquote><blockquote>“Identifica qué obligaciones aparecen expresamente y qué asuntos no están descritos”.</blockquote><div class=\"scenarioHead\">OTRAS FORMAS</div><p>Generar un mapa mental o un resumen de audio y contrastar lo obtenido con el texto original.</p></div>", "visual": "example", "tag": null}, {"section": "NotebookLM", "kicker": "DEMOSTRACIÓN · PASO A PASO", "title": "NotebookLM en vivo", "lead": "Mostrar el proceso antes de mostrar el resultado.", "body": "<div class=\"numberlist\"><p><i>1</i> Abrir NotebookLM y crear un cuaderno.</p><p><i>2</i> Añadir una fuente pública o autorizada.</p><p><i>3</i> Hacer una pregunta y abrir la referencia asociada.</p><p><i>4</i> En Studio, explorar un mapa mental o un resumen de audio, si está disponible.</p></div><a class=\"actionlink\" target=\"_blank\" rel=\"noopener\" href=\"https://notebooklm.google.com/\">Abrir NotebookLM ↗</a><div class=\"source\">Fuente: Ayuda oficial de Google · Crear un cuaderno y Studio</div>", "visual": "steps", "tag": null}, {"section": "NotebookLM", "kicker": "COMPARACIÓN CLARA", "title": "Copilot Notebooks ≠ NotebookLM", "lead": "Dos soluciones con enfoque en referencias, pero ecosistemas diferentes.", "body": "<div class=\"compare\"><div><span class=\"overline\">MICROSOFT</span><h3>Copilot Notebooks</h3><p>Trabaja con referencias en el entorno Microsoft Copilot y su ecosistema de productividad.</p><small>Acceso sujeto a licencia y permisos organizacionales.</small></div><div><span class=\"overline\">GOOGLE</span><h3>NotebookLM</h3><p>Orienta la exploración de fuentes a través de preguntas, mapas mentales y formatos de Studio.</p><small>Funciones disponibles según producto, cuenta y límites.</small></div></div><p class=\"takeaway\">En ambos casos, verificar la respuesta es parte del trabajo.</p>", "visual": "compare", "tag": null}, {"section": "Ruta", "kicker": "DESCANSO · 15 MIN", "title": "Un pequeño respiro", "lead": "Al regresar, veremos cómo convertir información en una lectura visual útil.", "body": "<div class=\"pauseIllustration\"><span class=\"floating a\">◇</span><span class=\"floating b\">✧</span><span class=\"floating c\">○</span><strong>De las fuentes<br>a la visualización</strong></div>", "visual": "pause", "tag": null}, {"section": "Dashboards", "kicker": "TEORÍA · DEFINICIÓN", "title": "¿Qué es un dashboard?", "lead": "Un tablero reúne indicadores relevantes para observar un proceso.", "body": "<div class=\"explain\"><p>Un <strong>dashboard</strong> presenta métricas y visualizaciones seleccionadas para facilitar el seguimiento, detectar cambios y orientar preguntas.</p><p>Un buen tablero comienza por una pregunta y una audiencia: <strong>¿qué necesita saber quien lo consulta?</strong></p><p><strong>No todo tablero se actualiza en tiempo real.</strong> La frecuencia depende de las fuentes y del proceso de actualización.</p></div>", "visual": "dashboard", "tag": null}, {"section": "Dashboards", "kicker": "TEORÍA · CONCEPTOS", "title": "Dato, métrica e indicador", "lead": "No todos los números significan lo mismo.", "body": "<div class=\"conceptrow\"><div><b>Dato</b><p>Registro puntual: fecha de recepción.</p></div><div class=\"arrow\">→</div><div><b>Métrica</b><p>Conteo o cálculo: solicitudes recibidas.</p></div><div class=\"arrow\">→</div><div><b>Indicador</b><p>Medida interpretada frente a un propósito.</p></div></div><p class=\"takeaway\">Un <strong>KPI</strong> es un indicador clave conectado con un objetivo. Para interpretarlo hacen falta fórmula, periodo y fuente.</p>", "visual": "concepts", "tag": null}, {"section": "Dashboards", "kicker": "TEORÍA · DISEÑO", "title": "La anatomía de un tablero claro", "lead": "Cinco componentes que no deberían faltar.", "body": "<div class=\"dashboardDemo\"><div class=\"dashTop\"><b>Seguimiento de un proceso</b><span>Periodo • fuente • actualización</span></div><div class=\"dashKpis\"><div>Indicador A<em>Valor</em></div><div>Indicador B<em>Valor</em></div><div>Indicador C<em>Valor</em></div></div><div class=\"dashCharts\"><div><svg viewBox=\"0 0 300 125\"><path d=\"M10 102 L65 78 L120 87 L174 46 L234 59 L290 21\" fill=\"none\" stroke=\"#9272d0\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M10 102 L65 78 L120 87 L174 46 L234 59 L290 21 L290 125 L10 125Z\" fill=\"#9272d01c\"/></svg><small>Tendencia en el tiempo</small></div><div><svg viewBox=\"0 0 300 125\"><rect x=\"22\" y=\"73\" width=\"47\" height=\"52\" rx=\"8\" fill=\"#c9b2e8\"/><rect x=\"92\" y=\"33\" width=\"47\" height=\"92\" rx=\"8\" fill=\"#f1afa6\"/><rect x=\"162\" y=\"57\" width=\"47\" height=\"68\" rx=\"8\" fill=\"#a6dacf\"/><rect x=\"232\" y=\"14\" width=\"47\" height=\"111\" rx=\"8\" fill=\"#b9a4e6\"/></svg><small>Comparación de categorías</small></div></div></div><p class=\"smallprint\">Maqueta conceptual sin datos reales ni valores simulados.</p>", "visual": "mockdash", "tag": null}, {"section": "Dashboards", "kicker": "TEORÍA · VISUALIZACIÓN", "title": "Elegir el gráfico correcto", "lead": "El gráfico depende de la pregunta, no del efecto visual.", "body": "<div class=\"stepcards\"><article><b>↗</b><h3>Línea</h3><p>¿Cómo cambia algo a lo largo del tiempo?</p></article><article><b>▥</b><h3>Barras</h3><p>¿Cómo se comparan varias categorías?</p></article><article><b>≡</b><h3>Tabla</h3><p>¿Qué detalle necesita revisarse exactamente?</p></article></div><p class=\"takeaway\">Reduce adornos, explica unidades y evita escalas que distorsionen.</p>", "visual": "charts", "tag": null}, {"section": "Dashboards", "kicker": "EJEMPLO · DESPUÉS DE LA TEORÍA", "title": "Leer antes de concluir", "lead": "Un tablero solo es confiable si se entiende su información.", "body": "<div class=\"scenario\"><div class=\"scenarioHead\">EJEMPLO SIN DATOS INSTITUCIONALES</div><p>Una tarjeta dice <strong>“Solicitudes atendidas”</strong>.</p><div class=\"scenarioHead\">PREGUNTAS NECESARIAS</div><div class=\"qchips\"><span>¿En qué periodo?</span><span>¿Atendidas significa resueltas?</span><span>¿Cuál es la fuente?</span><span>¿Cuándo se actualizó?</span></div><div class=\"truth\">Sin estas respuestas no corresponde concluir que el desempeño mejoró.</div></div>", "visual": "example", "tag": null}, {"section": "Dashboards", "kicker": "TEORÍA · CRITERIO", "title": "Cinco alertas al interpretar", "lead": "Un diseño atractivo no corrige una fuente incorrecta.", "body": "<div class=\"numberlist\"><p><i>1</i> Fecha de actualización ausente.</p><p><i>2</i> Indicadores sin definición, periodo o denominador.</p><p><i>3</i> Ejes o escalas que exageran diferencias.</p><p><i>4</i> Comparaciones entre poblaciones o periodos distintos.</p><p><i>5</i> Conclusiones causales sin evidencia.</p></div><div class=\"source\">Referencia conceptual: documentación de Power BI y principios básicos de visualización.</div>", "visual": "warning", "tag": null}, {"section": "Dashboards", "kicker": "ACTIVIDAD YA PREPARADA · 35 MIN", "title": "Tu ejercicio de dashboards", "lead": "Este espacio está reservado para la actividad que tú ya diseñaste.", "body": "<div class=\"reserved\"><div class=\"reservedIcon\">◎</div><h3>Aplicación práctica</h3><p>Ahora pasamos al ejercicio preparado por la docente.</p><p class=\"smallprint\">No se agregan datos, instrucciones ni casos nuevos para no interferir con tu material.</p></div>", "visual": "reserved", "tag": null}, {"section": "Cierre", "kicker": "CIERRE DEL MÓDULO · 25 MIN", "title": "La brújula que me llevo", "lead": "No termina el diplomado: termina este módulo y comienza la aplicación de lo aprendido.", "body": "<p>Una experiencia breve para transformar lo aprendido en una intención concreta, sin exponer trabajos individuales.</p><div class=\"stepcards\"><article><b>01</b><h3>Elige</h3><p>La herramienta que más valor te aportó.</p></article><article><b>02</b><h3>Decide</h3><p>Qué harás con ella.</p></article><article><b>03</b><h3>Protege</h3><p>Qué cuidado mantendrás.</p></article></div>", "visual": "compass", "tag": null}, {"section": "Cierre", "kicker": "DINÁMICA INTERACTIVA", "title": "Crea tu brújula personal", "lead": "Selecciona una herramienta y completa una frase; el resultado se muestra en pantalla.", "body": "<div class=\"closingForm\"><div class=\"field\"><label for=\"toolChoose\">1 · ¿Qué herramienta o concepto te llevas?</label><select id=\"toolChoose\"><option>Copilot Notebooks</option><option>NotebookLM</option><option>Dashboards</option><option>Gamma</option><option>Napkin AI</option><option>Criterio humano al usar IA</option></select></div><div class=\"field\"><label for=\"purpose\">2 · ¿Para qué lo usarás?</label><input maxlength=\"120\" id=\"purpose\" placeholder=\"Escribe una intención concreta, sin datos sensibles\" /></div><div class=\"field\"><label for=\"care\">3 · ¿Qué cuidado mantendrás?</label><select id=\"care\"><option>Verificar fuentes y resultados</option><option>Proteger datos personales</option><option>No inventar información</option><option>Revisar permisos y políticas</option><option>Explicar límites y supuestos</option></select></div><button class=\"btnprimary\" type=\"button\" id=\"makeCompass\">Revelar mi brújula ✧</button><div id=\"compassResult\" aria-live=\"polite\" class=\"compassResult\"><span>Tu brújula aparecerá aquí.</span></div><p class=\"smallprint\">La respuesta queda únicamente en este navegador: no se envía a un tablero colectivo ni se almacena en un servidor.</p></div>", "visual": "interactive", "tag": null}, {"section": "Cierre", "kicker": "CIERRE DEL MÓDULO", "title": "La IA amplía posibilidades. El criterio les da dirección.", "lead": "Gracias por imaginar, explorar y cuestionar.", "body": "<div class=\"finalQuote\">Lo importante no es usar más herramientas.<br><em>Es hacer mejores preguntas y verificar las respuestas.</em></div><p class=\"signature\">Amalia Avila Palacios</p>", "visual": "final", "tag": null}];

function render(i){current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current];C.innerHTML=`<div class="eyebrow">${s.kicker}</div><h1 class="headline">${s.title}</h1><p class="lead">${s.lead}</p><div class="body">${s.body}</div>`;V.innerHTML=visualFor(s);T.textContent=s.section;F.textContent=`${current+1} / ${slides.length}`;P.style.width=`${(current+1)/slides.length*100}%`;document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;S.style.animation='none';S.offsetHeight;S.style.animation='appear .45s ease';clearInk();initClosing();location.hash='s'+(current+1)}
function initClosing(){let btn=document.getElementById('makeCompass');if(!btn)return;btn.addEventListener('click',()=>{const x=document.getElementById('toolChoose').value,why=document.getElementById('purpose').value.trim(),c=document.getElementById('care').value;const out=document.getElementById('compassResult');out.replaceChildren();if(!why){out.textContent='Escribe primero para qué usarás esa herramienta.';return}const title=document.createElement('strong'),line=document.createElement('p'),care=document.createElement('p');title.textContent='Mi brújula: '+x;line.textContent='La usaré para: '+why;care.textContent='Mi compromiso de cuidado: '+c;out.append(title,line,care)});}
function next(){if(current<slides.length-1)render(current+1)}function prev(){if(current>0)render(current-1)}document.getElementById('nextBtn').onclick=next;document.getElementById('prevBtn').onclick=prev;
let ov=document.getElementById('overview');document.getElementById('overviewBtn').onclick=()=>ov.classList.add('open');document.getElementById('overviewClose').onclick=()=>ov.classList.remove('open');const grid=document.getElementById('overviewGrid');slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overviewItem';b.innerHTML=`<small>${i+1} · ${s.section}</small><b>${s.title}</b>`;b.onclick=()=>{ov.classList.remove('open');render(i)};grid.append(b)});
document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};const canvas=document.getElementById('ink'),ctx=canvas.getContext('2d');function sizeInk(){const r=S.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.strokeStyle='#d36e9e';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round'}function clearInk(){ctx.clearRect(0,0,canvas.width,canvas.height)}sizeInk();window.addEventListener('resize',sizeInk);document.getElementById('drawBtn').onclick=()=>{draw=!draw;canvas.classList.toggle('enabled',draw);document.getElementById('drawBtn').classList.toggle('drawOn',draw)};document.getElementById('clearBtn').onclick=clearInk;let painting=false;function xy(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}canvas.addEventListener('pointerdown',e=>{if(!draw)return;painting=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...xy(e))});canvas.addEventListener('pointermove',e=>{if(!painting)return;ctx.lineTo(...xy(e));ctx.stroke()});canvas.addEventListener('pointerup',()=>painting=false);canvas.addEventListener('pointercancel',()=>painting=false);
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(ov.classList.contains('open')){if(e.key==='Escape')ov.classList.remove('open');return}if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}if(e.key==='Home')render(0);if(e.key==='End')render(slides.length-1)});const hash=+(location.hash.replace('#s',''))-1;render(Number.isFinite(hash)&&hash>=0?hash:0);
